server {
  listen ${PORT:-8080};
  root /usr/share/nginx/html;
  index index.html;
  gzip on;
  gzip_types text/css application/javascript image/svg+xml;
  location / {
    try_files $uri $uri/ /index.html;
  }
  location ~* \.(js|css|png|jpg|jpeg)$ {
    expires 7d;
    add_header Cache-Control "public, immutable";
  }
}
